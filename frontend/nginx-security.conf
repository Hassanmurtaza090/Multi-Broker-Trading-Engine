# Frontend nginx security configuration (M14).
# Served for every request; headers do not override anything the API proxy
# would set (the terminal bundle is static, same-origin).

server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Security headers.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self' ws: wss:; img-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    # The terminal is an SPA: unknown paths fall back to the shell route.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache the HTML shell (assets are content-hashed). NOTE: nginx
    # add_header does not inherit when a block defines its own — repeat the
    # full security header set here.
    location = /index.html {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self' ws: wss:; img-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    }
}

[project]
name = "multi-broker-trading-engine"
version = "0.1.0"
description = "Broker-agnostic multi-broker trading engine (backend)"
requires-python = ">=3.13"
readme = "README.md"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["api*", "application*", "domain*", "infrastructure*", "brokers*", "market_data*", "execution*", "risk*", "portfolio*", "events*", "config*", "order_management*"]

[tool.pytest.ini_options]
testpaths = ["../tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["api", "application", "domain", "infrastructure", "brokers", "market_data", "execution", "risk", "portfolio", "events", "config", "order_management"]
# Multi-Broker Trading Engine — PRODUCTION-like deployment (M15).
#
# Operational stack: nginx TLS reverse proxy -> frontend bundle + backend
# gateway + PostgreSQL. Development uses docker-compose.yml (memory
# repository, plain HTTP, loopback binds); THIS file is the production
# posture:
#
#   - Only nginx is exposed (8443); backend/postgres/frontend are internal.
#   - Backend persists orders to PostgreSQL (ADR-010) and starts ONLY when
#     the database is healthy (startup ordering); SIGTERM -> graceful stop.
#   - TLS certs are mounted (never committed); generate staging ones with
#     scripts/generate_tls_certs.ps1|.sh.
#   - Resource limits + restart policies + log rotation on every service.
#
# `name` (review finding): an explicit project id keeps this stack's
# volumes/networks SEPARATE from the dev compose (same directory otherwise
# means a shared `postgres_data` volume — the two must never mix).
#
# Required environment (.env, gitignored): POSTGRES_PASSWORD, JWT_SECRET_KEY
# (>=32 bytes), AUTH_DEMO_* or AUTH_USERS_FILE, and optionally TLS_* paths.

name: mtbe-prod

x-logging: &default-logging
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-trading_engine}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1g

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      APP_ENV: production
      # Inside the container the compose network is the isolation boundary —
      # the process binds all interfaces (the backend publishes NO ports).
      API_HOST: 0.0.0.0
      # Persistence (M15): orders survive backend restarts (ADR-010).
      ORDER_REPOSITORY: postgres
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-trading_engine}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY in .env (>=32 bytes)}
      LOG_FORMAT: json
    depends_on:
      postgres:
        condition: service_healthy
    # No `ports`: backend is reachable ONLY inside the deployment network.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=5)"]
      interval: 15s
      timeout: 8s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    stop_grace_period: 30s
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1g

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128m

  proxy:
    # Unprivileged nginx (uid 101): 443/80 are unprivileged ports, so the
    # whole edge runs without root too.
    image: nginxinc/nginx-unprivileged:alpine
    volumes:
      # Replaces the stock default server: the whole public surface lives in
      # one config file (conf.d/default.conf).
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_CERT_DIR:-./infrastructure/nginx/certs}:/etc/nginx/certs:ro
    ports:
      - "${HTTPS_PORT:-8443}:443"
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_started
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 256m

volumes:
  postgres_data:

# Multi-Broker Trading Engine — production reverse proxy (M15).
#
# Sits in FRONT of the whole deployment: serves the static terminal bundle,
# proxies REST to the backend, upgrades WebSockets, and terminates TLS.
# ONLY whitelisted paths are forwarded — /metrics and /docs are NOT
# reachable from the public network (backend is on an internal network).

# Rate limiting zone: bursty-connection protection at the edge (a second
# layer on top of the M14 in-process throttles; per-IP, generous enough
# for a real operator terminal).
limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=30r/s;
limit_req_status 429;

upstream backend_api {
    server backend:8000;
    # Long-running broker connections keep workers busy; give requests a
    # fair timeout before recycling.
    keepalive 16;
}

server {
    listen 80;
    server_name _;
    # TLS is mandatory in production: plain HTTP only redirects.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # TLS (M15): certs are MOUNTED at runtime — never baked into the image
    # or committed. Modern TLS only (no legacy ciphers/protocols).
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    add_header Strict-Transport-Security "max-age=63072000" always;

    # Security headers: HSTS is TLS-only and set ONLY here (the frontend's
    # own nginx adds CSP/nosniff/frame options — never duplicated).
    add_header Strict-Transport-Security "max-age=63072000" always;

    # --- static terminal bundle (served by the hardened frontend image) ---
    location / {
        limit_req zone=api_per_ip burst=60 nodelay;
        proxy_pass http://frontend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- REST API ----------------------------------------------------------------
    location /api/ {
        limit_req zone=api_per_ip burst=60 nodelay;
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # --- WebSocket stream --------------------------------------------------------
    location /ws {
        limit_req zone=api_per_ip burst=30 nodelay;
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Long-lived streams: generous timeouts + disabled buffering.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }

    # --- infrastructure probes ------------------------------------------------------
    location = /ready {
        proxy_pass http://backend_api;
        access_log off;
    }

    # NEVER forwarded to the backend: operational metrics and the API schema
    # surface are in-cluster only. Without these explicit rejections the
    # paths would fall into `location /` (harmlessly serving the SPA shell —
    # but the edge must answer 404, not mask the path).
    location = /metrics { return 404; }
    location = /docs { return 404; }
    location = /redoc { return 404; }
    location = /openapi.json { return 404; }
}

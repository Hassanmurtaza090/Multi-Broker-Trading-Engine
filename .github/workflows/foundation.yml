name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (format + lint + types + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Format check
        run: python -m ruff format --check .
      - name: Lint
        run: python -m ruff check .
      - name: Type check (strict)
        run: python -m mypy .
      # tests/e2e drives the DEPLOYED production stack (docker-compose.prod.yml,
      # TLS edge on https://localhost:8443) and is executed separately against a
      # live deployment (TESTING.md Step 13); it cannot run in this in-memory job.
      - name: Unit + integration tests (in-memory repositories; live-stack e2e excluded)
        run: python -m pytest ../tests -q --ignore=../tests/e2e

  backend-persistence:
    name: Backend (PostgreSQL repository integration)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-db-pass
          POSTGRES_DB: trading_engine
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: PostgreSQL repository tests
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:ci-db-pass@127.0.0.1:5432/trading_engine
        run: python -m pytest ../tests/integration/persistence -q

  frontend:
    name: Frontend (lint + types + tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Format check
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm run test
      - name: Production build
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  containers:
    name: Container images build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t mtbe-backend:ci ./backend
      - name: Build frontend image
        run: docker build -t mtbe-frontend:ci ./frontend
      - name: Validate production compose
        env:
          POSTGRES_PASSWORD: ci-only-placeholder
          JWT_SECRET_KEY: ci-only-placeholder-secret-0123456789
        run: docker compose -f docker-compose.prod.yml config --quiet

  dependency-scan:
    name: Dependency scans
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e . pip-audit
      - name: pip-audit (project environment)
        run: python -m pip_audit
      - name: npm audit (production runtime deps)
        working-directory: frontend
        run: npm audit --omit=dev

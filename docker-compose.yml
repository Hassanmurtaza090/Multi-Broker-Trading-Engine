# Multi-Broker Trading Engine — Docker Compose (foundation scaffold)
#
# Currently operational: none (scaffold only).
# Services below are placeholders for future development (M15 makes them
# production-grade). PostgreSQL is included for local development from an
# early milestone once persistence lands.

services:
  postgres:
    image: postgres:16-alpine
    container_name: mtbe-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-trading_engine}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mtbe-backend
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"
    # command: uvicorn ... (uncommented once the FastAPI gateway exists, M10)

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mtbe-frontend
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-5173}:5173"

volumes:
  postgres_data: